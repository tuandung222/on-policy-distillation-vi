<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Book body -->
  <rect x="10" y="8" width="38" height="48" rx="3" ry="3" fill="url(#tealGrad)" opacity="0.9"/>
  <!-- Book spine -->
  <rect x="10" y="8" width="6" height="48" rx="2" ry="2" fill="#0e7490"/>
  <!-- Page lines -->
  <line x1="22" y1="20" x2="42" y2="20" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="22" y1="27" x2="42" y2="27" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="22" y1="34" x2="38" y2="34" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="22" y1="41" x2="40" y2="41" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Distillation sparkle -->
  <circle cx="50" cy="14" r="3" fill="#22d3ee" opacity="0.8"/>
  <circle cx="54" cy="22" r="2" fill="#67e8f9" opacity="0.6"/>
  <circle cx="48" cy="6" r="1.5" fill="#a5f3fc" opacity="0.5"/>
</svg>
